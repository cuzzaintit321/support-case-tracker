services:
  tracker:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8777:8777"]
    volumes: ["case_data:/data"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8777/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  case_data:
